name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tool tests
        run: python3 -I -m unittest discover -s tools/tests -v
      - name: Conventions in the tree
        run: python3 -I tools/check_conventions.py --all
      - name: Conventions in the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 -I tools/check_conventions.py --range "$BASE..$HEAD"
          else
            python3 -I tools/check_conventions.py --range "$HEAD"
          fi
      - name: Ledger
        run: python3 -I tools/debt_fold.py --check
      - name: Coverage
        run: python3 -I tools/def_coverage.py
      - name: Progress maps
        run: python3 -I tools/progress_map.py --check

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: DXIL validator
        shell: pwsh
        run: |
          $dxil = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxil.dll" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $dxil) { throw "no dxil.dll in the Windows SDK" }
          Write-Output "validator: $($dxil.FullName)"
          "G6SHIM_DXIL=$($dxil.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Test
        run: ctest --preset release
      - name: Configure Debug
        run: cmake --preset debug
      - name: Build Debug
        run: cmake --build --preset debug --parallel
      - name: Test Debug
        run: ctest --preset debug
